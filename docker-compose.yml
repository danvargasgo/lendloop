# Local n8n for LendLoop. Secrets live in .env.n8n (not committed), never in this file or the workflows.
services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.45.7
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    env_file:
      - .env.n8n # WEBHOOK_SECRET, the shared HMAC key, and optionally ALERT_WEBHOOK_URL
    environment:
      N8N_HOST: localhost
      N8N_PORT: "5678"
      WEBHOOK_URL: http://localhost:5678/
      GENERIC_TIMEZONE: America/Bogota
      N8N_DIAGNOSTICS_ENABLED: "false"
      # The Code nodes read WEBHOOK_SECRET with $env and verify signatures with the crypto module.
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      NODE_FUNCTION_ALLOW_BUILTIN: crypto
      # Where n8n reaches the Convex HTTP actions. From inside Docker, the host is host.docker.internal.
      CONVEX_SITE_URL: ${CONVEX_SITE_URL:-http://host.docker.internal:3211}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro

volumes:
  n8n_data:
